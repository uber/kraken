name: Publish images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

env:
  IMAGE: docker.io/uber/kraken

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build images
        run: make images

      - name: Tag and push images
        run: |
          version=$(git describe --always --tags)
          for component in agent build-index origin proxy testfs tracker; do
            for tag in "${version}" latest; do
              docker tag "kraken-${component}:${version}" "${IMAGE}:${component}-${tag}"
              docker push "${IMAGE}:${component}-${tag}"
            done
          done
