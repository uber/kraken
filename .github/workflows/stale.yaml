name: Stale PRs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  stale:
    name: Mark and close stale PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    steps:
      - uses: actions/stale@v11.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Only act on pull requests; issues are left untouched.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: 'stale'
          stale-pr-message: >
            This PR has had no activity for 30 days and is now marked as stale.
            It will be closed in 14 days unless there is new activity.
            Please rebase, address review feedback, or comment if you are still working on it.
            Maintainers can add the `keep-open` label to exempt a PR.
          close-pr-message: >
            Closing this PR after 14 days without activity since it was marked stale.
            Feel free to reopen it once you are ready to continue.
          exempt-pr-labels: 'keep-open,security'
          exempt-draft-pr: true
          remove-stale-when-updated: true
          operations-per-run: 100
